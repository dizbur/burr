[workspace]
members = ["programs/burrpad", "tests", "tests-standin"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Tests load a 10 MB copy of pump.fun's program; a little optimisation keeps them quick.
[profile.dev]
opt-level = 1
debug = false

[profile.test]
opt-level = 1
debug = false
